<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Advanced 3D Mol Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://3Dmol.org/build/3Dmol-min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        /* Custom scrollbar for the predictive search dropdown */
        #searchDropdown::-webkit-scrollbar { width: 6px; }
        #searchDropdown::-webkit-scrollbar-thumb { background: #4B5563; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans">

    <nav class="p-5 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <h1 class="text-2xl font-bold tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500">
            BIO-NEXUS <span class="text-xs text-gray-400 font-normal">by NEXORA™</span>
        </h1>
        <a href="../index.html" class="text-gray-400 hover:text-white transition">← Back to Hub</a>
    </nav>

    <div class="container mx-auto p-5 mt-5">
        <h2 class="text-3xl font-bold text-center mb-6 text-blue-400">Interactive Protein Visualizer</h2>
        
        <div class="relative flex justify-center gap-4 mb-6 max-w-2xl mx-auto">
            <div class="relative w-full">
                <input type="text" id="pdbInput" oninput="filterSearch()" placeholder="Type a Protein Name (e.g., Insulin) or PDB ID..." autocomplete="off" class="w-full p-3 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-blue-500 text-white shadow-inner">
                
                <ul id="searchDropdown" class="absolute w-full mt-1 bg-gray-800 border border-gray-700 rounded-md shadow-2xl max-h-60 overflow-y-auto hidden z-50">
                    </ul>
            </div>
            <button onclick="resolveAndLoadPDB()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 rounded font-bold transition shadow-lg shadow-blue-500/30 whitespace-nowrap">Visualize 🧬</button>
        </div>

        <div id="container-01" class="relative w-full h-[500px] border border-gray-700 rounded-xl overflow-hidden bg-black shadow-2xl">
            <p id="statusText" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-gray-500">Structure will load here...</p>
        </div>
        
        <p class="text-center text-gray-400 mt-4 text-sm">💡 <b>Pro Tip:</b> Hover your mouse over the 3D model to see Alpha Helices, Beta Sheets, and DNA Bases!</p>
    </div>

    <script>
        // ==========================================
        // 1. THE PROTEIN DICTIONARY (Data Layer)
        // ==========================================
        const commonProteins = [
            { name: "Hemoglobin (Blood Oxygen Transport)", code: "4HHB" },
            { name: "Insulin (Blood Sugar Regulation)", code: "1PEI" },
            { name: "Collagen (Skin & Bone Structure)", code: "1BKV" },
            { name: "DNA Double Helix", code: "1BNA" },
            { name: "GFP (Green Fluorescent Protein)", code: "1EMA" },
            { name: "CRISPR Cas9 (Gene Editing)", code: "5F9R" },
            { name: "Myoglobin (Muscle Oxygen)", code: "1MBN" },
            { name: "Keratin (Hair & Nails)", code: "3TNU" },
            { name: "Antibody IgG", code: "1IGT" },
            { name: "Ubiquitin", code: "1UBQ" },
            { name: "ATP Synthase (Energy Motor)", code: "1E79" }
        ];

        // ==========================================
        // 2. PREDICTIVE SEARCH LOGIC (UI Layer)
        // ==========================================
        function filterSearch() {
            let input = document.getElementById('pdbInput').value.toLowerCase();
            let dropdown = document.getElementById('searchDropdown');
            dropdown.innerHTML = ""; // Clear old results

            if (!input) {
                dropdown.classList.add('hidden');
                return;
            }

            // Find matching proteins
            let matches = commonProteins.filter(p => 
                p.name.toLowerCase().includes(input) || p.code.toLowerCase().includes(input)
            );

            if (matches.length > 0) {
                dropdown.classList.remove('hidden');
                matches.forEach(match => {
                    let li = document.createElement('li');
                    li.className = "px-4 py-3 hover:bg-gray-700 cursor-pointer flex justify-between items-center border-b border-gray-700 last:border-0";
                    li.innerHTML = `<span class="text-white">${match.name}</span> <span class="text-xs bg-blue-900 text-blue-300 px-2 py-1 rounded font-mono">${match.code}</span>`;
                    
                    // When clicked, fill input and load!
                    li.onclick = () => {
                        document.getElementById('pdbInput').value = match.code;
                        dropdown.classList.add('hidden');
                        resolveAndLoadPDB(); 
                    };
                    dropdown.appendChild(li);
                });
            } else {
                dropdown.classList.add('hidden');
            }
        }

        // Hide dropdown if user clicks somewhere else on the screen
        document.addEventListener('click', function(e) {
            if (!document.getElementById('pdbInput').contains(e.target)) {
                document.getElementById('searchDropdown').classList.add('hidden');
            }
        });

        // ==========================================
        // 3. API FETCH LOGIC
        // ==========================================
        async function resolveAndLoadPDB() {
            let input = document.getElementById('pdbInput').value.trim();
            let container = document.getElementById('container-01');

            if (!input) { alert("Please enter a protein name or PDB ID!"); return; }
            
            document.getElementById('searchDropdown').classList.add('hidden');
            container.innerHTML = "<p class='absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-blue-400 animate-pulse'>Loading structure...</p>";

            // Check if it's a 4-letter PDB code directly
            if (input.length === 4 && /^[a-zA-Z0-9]+$/.test(input)) {
                renderPDB(input.toUpperCase(), container);
                return;
            }

            // Fallback: Search RCSB API for names not in our dictionary
            try {
                const response = await fetch("https://search.rcsb.org/rcsbsearch/v2/query", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "query": { "type": "terminal", "service": "full_text", "parameters": { "value": input } },
                        "return_type": "entry",
                        "request_options": { "results_size": 1 }
                    })
                });
                if (!response.ok) throw new Error("API Search Failed");
                const data = await response.json();
                if (data.result_set && data.result_set.length > 0) {
                    renderPDB(data.result_set[0].identifier, container);
                } else {
                    container.innerHTML = "<p class='absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-red-500'>No structure found for '" + input + "'.</p>";
                }
            } catch (e) {
                container.innerHTML = "<p class='absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-red-500'>Error connecting to PDB Database.</p>";
            }
        }

        // ==========================================
        // 4. THE 3D RENDERER WITH HOVER LABELS 🪄
        // ==========================================
        function renderPDB(pdbID, containerElement) {
            containerElement.innerHTML = ""; 
            let config = { backgroundColor: 'black' };
            let viewer = $3Dmol.createViewer(containerElement, config);
            let uri = "https://files.rcsb.org/download/" + pdbID + ".pdb";
            
            jQuery.ajax({
                url: uri, 
                success: function(data) {
                    viewer.addModel(data, "pdb");                       
                    viewer.setStyle({}, {cartoon: {color: 'spectrum'}}); 
                    viewer.zoomTo();                                    
                    
                    // The Hover Logic
                    let hoverLabel = null;
                    viewer.setHoverable({}, true,
                        function(atom, viewer, event, container) {
                            if (!hoverLabel) {
                                // Detect structure type
                                let ssDict = {'h': 'Alpha Helix 🧬', 's': 'Beta Sheet 🏹', 'c': 'Coil 🪢'};
                                let ssInfo = ssDict[atom.ss] ? " | " + ssDict[atom.ss] : "";
                                
                                // Detect DNA/RNA Bases
                                let nucleicAcids = ['A', 'T', 'G', 'C', 'U', 'DA', 'DT', 'DG', 'DC'];
                                if (nucleicAcids.includes(atom.resn)) {
                                    ssInfo = " | DNA/RNA Base 🧪";
                                }

                                let labelText = `${atom.resn} (Atom: ${atom.elem}) ${ssInfo}`;
                                
                                // Create Label Box
                                hoverLabel = viewer.addLabel(labelText, {
                                    position: atom,
                                    backgroundColor: 'rgba(30, 58, 138, 0.9)', // Deep Blue
                                    fontColor: 'white',
                                    fontSize: 14,
                                    borderThickness: 1,
                                    borderColor: '#60A5FA', // Light Blue border
                                    borderRadius: 5,
                                    inFront: true
                                });
                            }
                        },
                        function(atom, viewer) {
                            if (hoverLabel) {
                                viewer.removeLabel(hoverLabel);
                                hoverLabel = null;
                            }
                        }
                    );

                    viewer.render();                                    
                },
                error: function() {
                    containerElement.innerHTML = "<p class='absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-red-500'>Failed to load ID: " + pdbID + "</p>";
                }
            });
        }
    </script>
</body>
</html>
