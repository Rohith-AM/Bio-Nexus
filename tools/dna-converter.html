<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Nexus | DNA Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen p-8">

    <header class="max-w-4xl mx-auto mb-12 text-center">
        <h1 class="text-4xl font-bold text-emerald-400 mb-2">BIO-NEXUS 🧬</h1>
        <p class="text-slate-400">The Open Source Bioinformatics Playground</p>
    </header>

    <main class="max-w-2xl mx-auto bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl">
        <h2 class="text-xl font-bold text-white mb-4">🧪 DNA Sequence Analyzer</h2>
        
        <div class="mb-6">
            <label class="block text-sm text-slate-400 mb-2">Enter DNA Sequence (A, T, G, C only):</label>
            <textarea id="dnaInput" rows="4" 
                class="w-full bg-slate-900 border border-slate-600 rounded-lg p-4 text-emerald-300 focus:outline-none focus:border-emerald-500 font-mono uppercase placeholder-slate-600"
                placeholder="ATGCGCTA..."></textarea>
        </div>

        <button onclick="analyzeDNA()" 
            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-lg transition mb-6 shadow-lg hover:shadow-emerald-500/20">
            Analyze Sequence ⚡
        </button>

        <div id="results" class="hidden space-y-4">
            
            <div class="bg-slate-900 p-4 rounded-lg flex justify-between items-center border border-slate-700">
                <span class="text-slate-400">Total Base Pairs (Length):</span>
                <span id="lengthDisplay" class="text-2xl font-bold text-white">0 bp</span>
            </div>

            <div class="bg-slate-900 p-4 rounded-lg flex justify-between items-center border border-slate-700">
                <span class="text-slate-400">GC Content (%):</span>
                <span id="gcDisplay" class="text-2xl font-bold text-yellow-400">0%</span>
            </div>
            
            <div class="bg-slate-900 p-4 rounded-lg flex justify-between items-center border border-slate-700">
                <span class="text-slate-400">Sample Type:</span>
                <span id="typeDisplay" class="text-lg font-bold text-blue-400">-</span>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-700 hidden" id="rnaContainer">
                <label class="block text-slate-400 text-sm mb-2 font-bold">
                    mRNA Sequence (Transcription) 💊:
                </label>
                <div id="rnaResult" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-lg text-purple-400 font-mono break-all select-all tracking-widest">
                    ---
                </div>
            </div>

            <div class="mt-6 pt-4 border-t border-slate-700" id="proteinContainer">
                <label class="block text-slate-400 text-sm mb-2 font-bold">
                    Protein Sequence (Amino Acids) 🥩:
                </label>
                <div id="proteinDisplay" class="w-full p-4 bg-slate-900 border border-slate-600 rounded-lg text-yellow-400 font-mono break-all select-all tracking-widest">
                    ---
                </div>
            </div>

        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
