<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXORA | Visual Restriction Mapper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tooltip style for hover effects */
        .cut-site { position: relative; display: inline-block; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen flex flex-col">

    <nav class="p-5 border-b border-gray-800 flex justify-between items-center bg-gray-900/50 backdrop-blur-md sticky top-0 z-50">
        <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-500">
            BIO-NEXUS <span class="text-xs text-gray-400">Restriction Map</span>
        </h1>
        <a href="../index.html" class="text-gray-400 hover:text-white transition">← Back</a>
    </nav>

    <div class="container mx-auto p-5 max-w-4xl flex-grow mt-4">
        <div class="bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
            <h2 class="text-2xl font-bold mb-2 text-purple-400">🧬 Visual Restriction Finder</h2>
            <p class="text-gray-400 text-sm mb-6">Scan your DNA sequence to visually locate enzyme restriction sites.</p>
            
            <label class="block text-gray-300 mb-2 font-bold">Paste DNA Sequence (A, T, G, C):</label>
            <textarea id="dnaInput" class="w-full p-4 bg-gray-900 rounded-lg border border-gray-600 font-mono text-green-400 focus:outline-none focus:border-purple-500 h-32 transition" placeholder="GAATTCGGATCC..."></textarea>

            <button onclick="findSites()" class="mt-4 w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold shadow-lg shadow-purple-500/30 transition text-lg tracking-wide">
                Scan & Visualize 🔍
            </button>

            <div id="results" class="mt-8 hidden opacity-0 transition-opacity duration-500">
                
                <div class="mb-6">
                    <h3 class="text-lg font-bold text-gray-300 mb-2">🗺️ Visual DNA Map:</h3>
                    <div id="visualMap" class="w-full p-5 bg-black border border-gray-700 rounded-lg text-gray-500 font-mono break-all leading-loose text-lg tracking-widest shadow-inner">
                        </div>
                </div>

                <h3 class="text-lg font-bold text-gray-300 border-b border-gray-600 pb-2">📊 Analysis Summary:</h3>
                <div id="outputList" class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-4">
                    </div>

            </div>
        </div>
    </div>

    <script>
        // 1. Data Dictionary with Colors mapped to each enzyme
        const enzymeData = {
            "EcoRI":   { seq: "GAATTC", color: "text-red-400 bg-red-900/40 border-red-500", badge: "bg-red-500" },
            "BamHI":   { seq: "GGATCC", color: "text-blue-400 bg-blue-900/40 border-blue-500", badge: "bg-blue-500" },
            "HindIII": { seq: "AAGCTT", color: "text-green-400 bg-green-900/40 border-green-500", badge: "bg-green-500" },
            "NotI":    { seq: "GCGGCCGC", color: "text-yellow-400 bg-yellow-900/40 border-yellow-500", badge: "bg-yellow-500" },
            "XbaI":    { seq: "TCTAGA", color: "text-pink-400 bg-pink-900/40 border-pink-500", badge: "bg-pink-500" }
        };

        function findSites() {
            let rawInput = document.getElementById('dnaInput').value.toUpperCase();
            let dna = rawInput.replace(/[^ATGC]/g, ''); // Strict cleaning
            
            let outputDiv = document.getElementById('outputList');
            let visualMap = document.getElementById('visualMap');
            let resultsSection = document.getElementById('results');
            
            outputDiv.innerHTML = ""; 
            
            if(!dna) {
                alert("Please enter a valid DNA sequence!");
                return;
            }

            // Reveal Results Section with Animation
            resultsSection.classList.remove('hidden');
            setTimeout(() => resultsSection.classList.remove('opacity-0'), 50);

            let foundAny = false;
            let highlightedDNA = dna; // Copy for visualization

            // 2. Scan and Highlight Process
            for (let [name, data] of Object.entries(enzymeData)) {
                let count = 0;
                let positions = [];
                let regex = new RegExp(data.seq, 'g'); 
                let match;

                // Find counts and positions
                while ((match = regex.exec(dna)) !== null) {
                    count++;
                    positions.push(match.index + 1); 
                }

                if (count > 0) {
                    foundAny = true;
                    
                    // Inject Visual Highlights (The Hack: We match uppercase DNA, avoiding lowercase HTML attributes!)
                    highlightedDNA = highlightedDNA.replace(
                        regex, 
                        `<span class="cut-site border-b-4 rounded px-1 mx-0.5 cursor-help ${data.color} font-bold" title="✂️ ${name} cuts here!">${data.seq}</span>`
                    );

                    // Add Summary Card
                    outputDiv.innerHTML += `
                        <div class="bg-gray-700/50 p-4 rounded-lg border-l-4 ${data.color.split(' ')[2]} backdrop-blur-sm">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="w-3 h-3 rounded-full ${data.badge} shadow-lg"></span>
                                <h4 class="font-bold text-lg text-white">${name}</h4>
                            </div>
                            <p class="text-sm text-gray-300">Sequence: <span class="font-mono text-white bg-gray-900 px-2 py-0.5 rounded">${data.seq}</span></p>
                            <p class="text-sm mt-1 text-gray-300">Found: <b class="text-white text-lg">${count}</b> times</p>
                            <p class="text-xs text-gray-400 mt-2">Positions: ${positions.join(', ')}</p>
                        </div>
                    `;
                }
            }

            // 3. Render Visual Map
            if (foundAny) {
                visualMap.innerHTML = highlightedDNA;
            } else {
                visualMap.innerHTML = `<span class="text-gray-600">${dna}</span>`;
                outputDiv.innerHTML = `
                    <div class="col-span-2 bg-gray-800 p-6 rounded-lg text-center border border-gray-700">
                        <p class="text-gray-400 text-lg">🧬 No common restriction sites found in this sequence.</p>
                        <p class="text-sm text-gray-500 mt-2">Try pasting a sequence with GAATTC (EcoRI) or GGATCC (BamHI).</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
