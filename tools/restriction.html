<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restriction Mapper — Bio-Nexus</title>
    <link rel="stylesheet" href="tool-shell.css">
    <style>
        :root { --tool-accent: #EF4444; }

        /* Enzyme badge colors (dynamic, keep Tailwind-free since we dropped it) */
        .enz-0  { background: rgba(239,68,68,.15);  border-color:rgba(239,68,68,.35);  color:#fca5a5; }
        .enz-1  { background: rgba(59,130,246,.15); border-color:rgba(59,130,246,.35); color:#93c5fd; }
        .enz-2  { background: rgba(34,197,94,.15);  border-color:rgba(34,197,94,.35);  color:#86efac; }
        .enz-3  { background: rgba(234,179,8,.15);  border-color:rgba(234,179,8,.35);  color:#fde047; }
        .enz-4  { background: rgba(168,85,247,.15); border-color:rgba(168,85,247,.35); color:#d8b4fe; }
        .enz-5  { background: rgba(236,72,153,.15); border-color:rgba(236,72,153,.35); color:#f9a8d4; }
        .enz-6  { background: rgba(6,182,212,.15);  border-color:rgba(6,182,212,.35);  color:#67e8f9; }
        .enz-7  { background: rgba(249,115,22,.15); border-color:rgba(249,115,22,.35); color:#fdba74; }

        /* Visual DNA map */
        #visualMap {
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 2;
            letter-spacing: 0.08em;
            word-break: break-all;
            padding: 14px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text3);
        }

        /* Cut site result cards */
        .cut-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            border-top: 2px solid;
        }
        .cut-card + .cut-card { margin-top: 8px; }
        .cut-card-name { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
        .cut-card-seq  { font-family: var(--font-mono); font-size: 11px; color: var(--text2); }
        .cut-card-hits { font-size: 22px; font-weight: 700; color: var(--text); }
        .cut-card-pos  { font-family: var(--font-mono); font-size: 11px; color: var(--text3); margin-top: 6px; max-height: 60px; overflow-y: auto; }

        #selectedBadges { display: flex; flex-wrap: wrap; gap: 6px; min-height: 32px; padding: 6px 0; }
    </style>
</head>
<body>

    <!-- Topbar -->
    <nav class="nt-topbar">
        <a href="../index.html" class="nt-brand">
            <span class="nt-brand-dot"></span>Bio-Nexus
        </a>
        <span class="nt-tool-name">Restriction Mapper</span>
        <a href="../index.html" class="nt-hub-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Hub
        </a>
    </nav>

    <div class="nt-page">
        <main class="nt-main nt-main--wide" style="max-width:860px">

            <div class="nt-page-header">
                <h1 class="nt-page-title">Restriction Mapper</h1>
                <p class="nt-page-desc">Search and map restriction enzyme cut sites across a DNA sequence using the full REBASE database (5600+ enzymes).</p>
            </div>

            <!-- Enzyme selector -->
            <div class="nt-card">
                <label class="nt-label">Select Restriction Enzymes</label>
                <div style="position:relative">
                    <div class="nt-search-wrap">
                        <svg class="nt-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input type="text" id="enzSearch" class="nt-input" oninput="handleEnzSearch()" onclick="handleEnzSearch()"
                            placeholder="Search 5600+ enzymes (e.g. EcoRI, AluI, TaqI)..." autocomplete="off">
                    </div>
                    <div id="enzSuggestions" class="nt-dropdown hidden"></div>
                </div>
                <div class="nt-gap"></div>
                <div id="selectedBadges">
                    <span id="emptyBadgeMsg" style="font-size:12px;color:var(--text3);align-self:center">No enzymes selected — search to add.</span>
                </div>
            </div>

            <div class="nt-gap"></div>

            <!-- Sequence input -->
            <div class="nt-card">
                <label class="nt-label">DNA Sequence (5' → 3')</label>
                <textarea id="dnaInput" class="nt-textarea" rows="4"
                    placeholder="AGCACATTTACTACGACTCAGAATTCAAGAAGTGGTCTAACGTGTTT..." spellcheck="false"
                    style="text-transform:uppercase"></textarea>
                <div class="nt-gap"></div>
                <button onclick="mapDNA()" class="nt-btn nt-btn--primary nt-btn--full">
                    Scan Sequence
                </button>
            </div>

            <!-- Results -->
            <div id="results" class="hidden nt-anim">
                <div class="nt-gap-lg"></div>

                <div class="nt-card">
                    <p class="nt-card-title">Interactive DNA Map</p>
                    <div id="visualMap">Run a scan to see the annotated sequence.</div>
                </div>

                <div class="nt-gap-lg"></div>

                <p class="nt-card-title" style="padding:0 4px">Cut Site Analysis</p>
                <div class="nt-gap"></div>
                <div id="outputList"></div>
            </div>

        </main>
    </div>

    <script>
        let globalEnzymeDB = {};
        let selectedEnzymes = ["EcoRI", "BamHI", "HindIII", "AluI", "NotI", "XbaI"];

        const ENZ_CLASSES = ['enz-0','enz-1','enz-2','enz-3','enz-4','enz-5','enz-6','enz-7'];
        const ENZ_COLORS  = ['#fca5a5','#93c5fd','#86efac','#fde047','#d8b4fe','#f9a8d4','#67e8f9','#fdba74'];
        const ENZ_BORDERS = ['#ef4444','#3b82f6','#22c55e','#eab308','#a855f7','#ec4899','#06b6d4','#f97316'];

        const iupacMap = {
            'A':'A','C':'C','G':'G','T':'T',
            'R':'[GA]','Y':'[CT]','M':'[AC]','K':'[GT]','S':'[GC]','W':'[AT]',
            'B':'[CGT]','D':'[AGT]','H':'[ACT]','V':'[ACG]','N':'[ACGT]'
        };

        async function loadRebaseDatabase() {
            try {
                const res = await fetch('rebase.json');
                globalEnzymeDB = await res.json();
                renderSelectedBadges();
            } catch(e) {
                console.error("Failed to load rebase.json", e);
            }
        }
        loadRebaseDatabase();

        function handleEnzSearch() {
            let q = document.getElementById('enzSearch').value.toUpperCase();
            let box = document.getElementById('enzSuggestions');
            let matches = q.length < 1
                ? ["EcoRI","BamHI","HindIII","AluI","NotI","TaqI","XbaI","SmaI","PstI","SalI"]
                : Object.keys(globalEnzymeDB).filter(e => e.toUpperCase().includes(q)).slice(0, 12);

            box.innerHTML = '';
            if (!matches.length) { box.classList.add('hidden'); return; }

            box.classList.remove('hidden');
            if (q.length < 1) {
                box.innerHTML = `<div class="nt-dropdown-header">Frequently Used</div>`;
            }
            matches.forEach(m => {
                let seq = globalEnzymeDB[m] || '';
                let div = document.createElement('div');
                div.className = 'nt-dropdown-item';
                div.innerHTML = `<span class="nt-dropdown-item-name">${m}</span><span class="nt-dropdown-item-meta">${seq}</span>`;
                div.onclick = () => { addEnzyme(m); box.classList.add('hidden'); document.getElementById('enzSearch').value = ''; };
                box.appendChild(div);
            });
        }

        document.addEventListener('click', e => {
            if (!e.target.closest('#enzSearch') && !e.target.closest('#enzSuggestions'))
                document.getElementById('enzSuggestions').classList.add('hidden');
        });

        function addEnzyme(name) {
            if (!selectedEnzymes.includes(name)) { selectedEnzymes.push(name); renderSelectedBadges(); }
        }

        function removeEnzyme(name) {
            selectedEnzymes = selectedEnzymes.filter(e => e !== name);
            renderSelectedBadges();
        }

        function renderSelectedBadges() {
            let container = document.getElementById('selectedBadges');
            let emptyMsg  = document.getElementById('emptyBadgeMsg');
            if (selectedEnzymes.length === 0) {
                container.innerHTML = '';
                container.appendChild(emptyMsg || (() => {
                    let s = document.createElement('span');
                    s.id = 'emptyBadgeMsg';
                    s.style = 'font-size:12px;color:var(--text3);align-self:center';
                    s.textContent = 'No enzymes selected — search to add.';
                    return s;
                })());
                return;
            }
            container.innerHTML = '';
            selectedEnzymes.forEach((enz, i) => {
                let cls = ENZ_CLASSES[i % ENZ_CLASSES.length];
                let btn = document.createElement('span');
                btn.className = `nt-enzyme-badge ${cls}`;
                btn.innerHTML = `${enz}<button class="nt-enzyme-badge-remove" onclick="removeEnzyme('${enz}')">×</button>`;
                container.appendChild(btn);
            });
        }

        function getRegexFromSequence(seq) {
            let r = "";
            for (let c of seq.toUpperCase()) r += iupacMap[c] || c;
            return new RegExp(`(?=(${r}))`, 'g');
        }

        function mapDNA() {
            let dna = document.getElementById('dnaInput').value.toUpperCase().replace(/[^ATGC]/g, '');
            let results = document.getElementById('results');
            let outputDiv = document.getElementById('outputList');
            let visualMap = document.getElementById('visualMap');

            outputDiv.innerHTML = '';
            if (!dna || selectedEnzymes.length === 0) {
                alert("Please enter a DNA sequence and select at least one enzyme.");
                return;
            }

            results.classList.remove('hidden');

            let charMap = dna.split('').map(c => ({ char: c, enz: [], color: null, border: null }));
            let foundAny = false;

            selectedEnzymes.forEach((enz, index) => {
                let seq = globalEnzymeDB[enz];
                if (!seq) return;
                let regex = getRegexFromSequence(seq);
                let color  = ENZ_COLORS[index % ENZ_COLORS.length];
                let border = ENZ_BORDERS[index % ENZ_BORDERS.length];
                let cls    = ENZ_CLASSES[index % ENZ_CLASSES.length];
                let positions = [];
                let match;

                while ((match = regex.exec(dna)) !== null) {
                    let actual = match[1];
                    positions.push(match.index + 1);
                    for (let i = 0; i < actual.length; i++) {
                        let t = charMap[match.index + i];
                        if (t && !t.enz.includes(enz)) {
                            t.enz.push(enz);
                            if (!t.color) { t.color = color; t.border = border; }
                        }
                    }
                    regex.lastIndex = match.index + 1;
                }

                if (positions.length > 0) {
                    foundAny = true;
                    let card = document.createElement('div');
                    card.className = 'cut-card nt-anim';
                    card.style.borderTopColor = border;
                    card.innerHTML = `
                        <div class="cut-card-name">${enz}
                            <span class="nt-badge" style="font-size:10px;margin-left:6px">${seq}</span>
                        </div>
                        <div style="display:flex;align-items:baseline;gap:10px;margin-top:8px">
                            <span class="cut-card-hits">${positions.length}</span>
                            <span style="font-size:12px;color:var(--text2)">cut site${positions.length !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="cut-card-pos">Positions: ${positions.join(', ')}</div>
                    `;
                    outputDiv.appendChild(card);
                }
            });

            // Build visual map
            let html = '';
            let currEnzStr = null;
            for (let i = 0; i < charMap.length; i++) {
                let c = charMap[i];
                let enzStr = c.enz.join(',');
                if (enzStr !== currEnzStr) {
                    if (i > 0) html += '</span>';
                    if (!enzStr) {
                        html += '<span style="color:var(--text3)">';
                    } else {
                        html += `<span style="color:${c.color};font-weight:700;border-bottom:2px solid ${c.border}" title="${c.enz.map(e=>'✂ '+e).join(' | ')}">`;
                    }
                    currEnzStr = enzStr;
                }
                html += c.char;
            }
            html += '</span>';

            if (!foundAny) {
                visualMap.innerHTML = `<span style="color:var(--text3)">${dna}</span>`;
                outputDiv.innerHTML = `<div class="nt-card" style="text-align:center;color:var(--text2);padding:28px">No cut sites found for the selected enzymes in this sequence.</div>`;
            } else {
                visualMap.innerHTML = html;
            }
        }

        // Dr. Nexus Page Context Provider
        window.nexusContext = function() {
            const raw = document.getElementById('dnaInput')?.value.trim() || '';
            const cuts = Array.from(document.querySelectorAll('#outputList .cut-card')).map(card => {
                const name = card.querySelector('.cut-card-name')?.textContent?.trim() || '';
                const hits = card.querySelector('.cut-card-hits')?.textContent?.trim() || '0';
                const pos = card.querySelector('.cut-card-pos')?.textContent?.trim() || '';
                return `${name}: ${hits} cuts (${pos})`;
            });

            return {
                tool: "Restriction Mapper",
                icon: "✂️",
                accent: "#EF4444",
                active: Boolean(raw || selectedEnzymes.length > 0),
                summary: raw 
                    ? `Sequence ${raw.length} bp · Enzymes: ${selectedEnzymes.slice(0, 4).join(', ')} · ${cuts.length} cut profiles`
                    : `Selected Enzymes: ${selectedEnzymes.join(', ')}`,
                quickPrompts: [
                    "Which of these enzymes is ideal for directional cloning?",
                    "Analyze the cut site distribution across my sequence",
                    "Are any of these enzymes producing blunt versus sticky overhangs?"
                ],
                data: {
                    selectedEnzymes: selectedEnzymes,
                    sequenceLength: raw ? raw.length + ' bp' : null,
                    sequenceSnippet: raw ? (raw.length > 250 ? raw.slice(0, 250) + '... (truncated)' : raw) : null,
                    cutSiteResults: cuts.length > 0 ? cuts : "Scan not run or 0 cut sites"
                }
            };
        };
    </script>
    <script src="../js/nexus-widget.js"></script>
</body>
</html>
