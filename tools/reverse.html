<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Complement — Bio-Nexus</title>
    <link rel="stylesheet" href="tool-shell.css">
    <style> :root { --tool-accent: #8B5CF6; } </style>
</head>
<body>

    <!-- Topbar -->
    <nav class="nt-topbar">
        <a href="../index.html" class="nt-brand">
            <span class="nt-brand-dot"></span>Bio-Nexus
        </a>
        <span class="nt-tool-name">Reverse Complement</span>
        <a href="../index.html" class="nt-hub-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
            Hub
        </a>
    </nav>

    <div class="nt-page">
        <main class="nt-main">

            <div class="nt-page-header">
                <h1 class="nt-page-title">Reverse Complement</h1>
                <p class="nt-page-desc">Generates the reverse, complement, and reverse-complement of any DNA sequence instantly.</p>
            </div>

            <!-- Input -->
            <div class="nt-card">
                <label class="nt-label">DNA Sequence (5' → 3')</label>
                <div style="position:relative">
                    <textarea id="seqInput" class="nt-textarea" rows="4"
                        placeholder="ATGC..." spellcheck="false" autocorrect="off"
                        style="text-transform:uppercase"></textarea>
                    <button onclick="clearInput()"
                        style="position:absolute;top:10px;right:10px;background:none;border:none;font-size:11px;color:var(--text3);cursor:pointer;font-family:var(--font-sans)">
                        Clear
                    </button>
                </div>
                <div class="nt-gap"></div>
                <button onclick="processSequence()" class="nt-btn nt-btn--primary nt-btn--full">
                    Generate Strands
                </button>
            </div>

            <!-- Output -->
            <div id="outputSection" class="hidden nt-anim">
                <div class="nt-gap-lg"></div>
                <div class="nt-card">
                    <p class="nt-card-title">Strand Outputs</p>

                    <div class="nt-result-block">
                        <p class="nt-result-label">Reverse Sequence</p>
                        <div id="revOutput" class="nt-result-value" style="color:#60a5fa">---</div>
                        <button class="nt-result-copy" onclick="copyToClipboard('revOutput')">Copy</button>
                    </div>

                    <div class="nt-gap"></div>

                    <div class="nt-result-block">
                        <p class="nt-result-label">Complement Sequence</p>
                        <div id="compOutput" class="nt-result-value" style="color:#a78bfa">---</div>
                        <button class="nt-result-copy" onclick="copyToClipboard('compOutput')">Copy</button>
                    </div>

                    <div class="nt-gap"></div>

                    <div class="nt-result-block" style="border-color:color-mix(in srgb, var(--tool-accent) 30%, transparent)">
                        <p class="nt-result-label nt-result-label--accent">Reverse Complement (Primary Result)</p>
                        <div id="revCompOutput" class="nt-result-value" style="color:#8B5CF6;font-weight:600">---</div>
                        <button class="nt-result-copy" onclick="copyToClipboard('revCompOutput')">Copy</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        function processSequence() {
            let rawSeq = document.getElementById('seqInput').value.toUpperCase();
            let seq = rawSeq.replace(/[^ATGC]/g, '');

            if (!seq) { alert("Please enter a valid DNA sequence (A, T, G, C)."); return; }

            let reverse = seq.split('').reverse().join('');

            let complement = "";
            let map = { 'A': 'T', 'T': 'A', 'G': 'C', 'C': 'G' };
            for (let char of seq) complement += map[char] || char;

            let revComp = "";
            for (let char of reverse) revComp += map[char] || char;

            document.getElementById('revOutput').innerText     = reverse;
            document.getElementById('compOutput').innerText    = complement;
            document.getElementById('revCompOutput').innerText = revComp;

            document.getElementById('outputSection').classList.remove('hidden');
        }

        function clearInput() {
            document.getElementById('seqInput').value = '';
            document.getElementById('outputSection').classList.add('hidden');
        }

        function copyToClipboard(id) {
            let text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const el = document.getElementById(id);
                const orig = el.innerText;
                el.innerText = 'Copied!';
                setTimeout(() => el.innerText = orig, 1200);
            });
        }

        // Dr. Nexus Page Context Provider
        window.nexusContext = function() {
            const raw = document.getElementById('seqInput')?.value.trim() || '';
            const revComp = document.getElementById('revCompOutput')?.innerText || '';
            const hasRes = !document.getElementById('outputSection')?.classList.contains('hidden') && revComp !== '---';

            return {
                tool: "Reverse Complement Generator",
                icon: "🔄",
                accent: "#8B5CF6",
                active: Boolean(raw),
                summary: raw ? `Strand (${raw.length} bp) · Rev-Comp generated` : "Awaiting 5'→3' sequence input",
                quickPrompts: [
                    "Calculate the melting temperature (Tm) of this reverse complement strand",
                    "How should I use this reverse complement for PCR reverse primer design?",
                    "Check this strand for potential primer-dimers or secondary hairpins"
                ],
                data: {
                    originalSequence: raw ? (raw.length > 250 ? raw.slice(0, 250) + '... (truncated)' : raw) : null,
                    reverseStrand: hasRes ? document.getElementById('revOutput')?.innerText?.slice(0, 100) : null,
                    complementStrand: hasRes ? document.getElementById('compOutput')?.innerText?.slice(0, 100) : null,
                    reverseComplementStrand: hasRes ? revComp.slice(0, 100) : null
                }
            };
        };
    </script>
    <script src="../js/nexus-widget.js"></script>
</body>
</html>
