<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | AI Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; }
        .typing-dot { animation: typing 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col">

    <nav class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🤖</span>
            <h1 class="text-xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">Bio-Nexus AI</h1>
        </div>
        <a href="../index.html" class="text-sm text-slate-400 hover:text-white transition">← Back to Lab</a>
    </nav>

    <main class="flex-grow p-4 max-w-3xl mx-auto w-full flex flex-col gap-4" id="chatContainer">
        
        <div class="flex gap-3">
            <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-sm">AI</div>
            <div class="bg-slate-800 p-3 rounded-2xl rounded-tl-none border border-slate-700 max-w-[80%]">
                <p class="text-sm text-slate-200">Hello Commander! I am connected to Gemini. Ask me anything about Biology, Code, or Research.</p>
            </div>
        </div>

    </main>

    <footer class="p-4 bg-slate-900 border-t border-slate-800 sticky bottom-0">
        <div class="max-w-3xl mx-auto relative">
            <input type="text" id="userInput" placeholder="Ask Dr. Nexus..." 
                class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 px-4 pr-12 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition shadow-lg">
            <button onclick="sendMessage()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg transition text-white">
                ➤
            </button>
        </div>
    </footer>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        // Allow Enter key to send
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. Add User Message
            addMessage(text, 'user');
            userInput.value = '';

            // 2. Add Loading Indicator
            const loadingId = addLoading();

            try {
                // 3. Call our Backend API (The Bridge)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();

                if (data.reply) {
                    addMessage(data.reply, 'ai');
                } else {
                    addMessage("Error: " + (data.error || "Something went wrong"), 'ai');
                }

            } catch (err) {
                document.getElementById(loadingId).remove();
                addMessage("System Error: Unable to reach the Neural Core.", 'ai');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `flex gap-3 ${sender === 'user' ? 'flex-row-reverse' : ''}`;
            
            const avatar = sender === 'user' ? '👤' : 'AI';
            const bgClass = sender === 'user' ? 'bg-blue-600 text-white' : 'bg-slate-800 border border-slate-700 text-slate-200';
            const rounded = sender === 'user' ? 'rounded-tr-none' : 'rounded-tl-none';

            div.innerHTML = `
                <div class="w-8 h-8 rounded-full ${sender === 'user' ? 'bg-blue-500' : 'bg-emerald-600'} flex items-center justify-center text-xs font-bold shrink-0">${avatar}</div>
                <div class="${bgClass} p-3 rounded-2xl ${rounded} max-w-[80%] shadow-sm overflow-hidden">
                    <p class="text-sm whitespace-pre-wrap leading-relaxed">${formatText(text)}</p>
                </div>
            `;
            chatContainer.appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        }

        function addLoading() {
            const id = 'loading-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex gap-3";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-xs shrink-0">AI</div>
                <div class="bg-slate-800 p-4 rounded-2xl rounded-tl-none border border-slate-700 flex gap-1 items-center">
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                    <div class="w-2 h-2 bg-slate-400 rounded-full typing-dot"></div>
                </div>
            `;
            chatContainer.appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
            return id;
        }

        // Simple markdown formatter for bold text
        function formatText(text) {
            return text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
        }
    </script>
</body>
</html>
