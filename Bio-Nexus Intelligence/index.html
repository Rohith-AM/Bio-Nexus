<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence — Bio-Nexus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ── Topbar (consistent with all tools) ─────────────────────────── -->
    <nav class="ni-topbar">
        <a href="../index.html" class="ni-brand">
            <span class="ni-brand-dot"></span>Bio-Nexus
        </a>
        <span class="ni-tool-name">Species Intelligence Engine</span>
        <a href="../index.html" class="ni-hub-link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Hub
        </a>
    </nav>

    <!-- ══════════════════════════════════════════════════════════
         SEARCH LANDING (visible on initial load)
    ═══════════════════════════════════════════════════════════ -->
    <section id="searchSection" class="ni-search-section">

        <div class="ni-search-hero">
            <span class="ni-hero-eyebrow">Bio-Nexus Intelligence</span>
            <h1 class="ni-hero-title">Explore the Biosphere</h1>
            <p class="ni-hero-desc">Interactive taxonomy, global occurrence mapping, wild bioacoustics & literature indexing.</p>
        </div>

        <div class="ni-search-wrap">
            <div class="ni-search-field">
                <svg class="ni-si-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" class="ni-search-input"
                    placeholder="Search any species — e.g. Panthera tigris, Apis mellifera, Homo sapiens..."
                    autocomplete="off" spellcheck="false">
                <button id="searchBtn" class="ni-search-btn">Search</button>
            </div>
            <div id="suggestions" class="ni-suggestions hidden"></div>
        </div>

        <div class="ni-examples">
            <span class="ni-examples-label">Quick Jump:</span>
            <button class="ni-example" onclick="quickSearch('Panthera tigris')">Bengal Tiger</button>
            <button class="ni-example" onclick="quickSearch('Apis mellifera')">Honey Bee</button>
            <button class="ni-example" onclick="quickSearch('Homo sapiens')">Homo sapiens</button>
            <button class="ni-example" onclick="quickSearch('Copsychus saularis')">Magpie Robin</button>
            <button class="ni-example" onclick="quickSearch('Ginkgo biloba')">Ginkgo Tree</button>
        </div>

    </section>

    <!-- ══════════════════════════════════════════════════════════
         RESULTS DASHBOARD (shown after search)
    ═══════════════════════════════════════════════════════════ -->
    <section id="resultsSection" class="hidden">
        <div class="ni-results">

            <!-- Species Identity Strip with Live Search -->
            <div class="ni-species-strip">
                <div class="ni-species-photo-wrap">
                    <img id="speciesImg" class="ni-species-photo hidden" alt="Species photo">
                    <div id="speciesPhotoFx" class="ni-species-photo-fx">🧬</div>
                </div>
                <div class="ni-species-identity">
                    <div class="ni-species-title-row">
                        <h2 id="speciesCommon" class="ni-species-common">—</h2>
                        <span id="rankBadge" class="ni-badge ni-badge--rank">SPECIES</span>
                    </div>
                    <p id="speciesSci" class="ni-species-sci">—</p>
                    <div id="taxaBreadcrumb" class="ni-taxa-crumb"></div>
                </div>

                <!-- Instant In-line Search on Results View -->
                <div class="ni-inline-search-wrap">
                    <div class="ni-inline-search-field">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="color:var(--text3);flex-shrink:0">
                            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="inlineSearchInput" class="ni-inline-search-input" placeholder="Search other species..." autocomplete="off" spellcheck="false">
                    </div>
                    <div id="inlineSuggestions" class="ni-suggestions hidden"></div>
                </div>

                <button id="newSearchBtn" class="ni-new-search-btn" title="Back to main search">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M19 12H5M12 5l-7 7 7 7"/>
                    </svg>
                    Home
                </button>
            </div>

            <!-- Tab Navigation with Live Badges -->
            <div class="ni-tabs" role="tablist">
                <button class="ni-tab active" data-tab="overview">
                    Overview
                </button>
                <button class="ni-tab" data-tab="map">
                    Distribution Map
                    <span id="mapTabBadge" class="ni-tab-counter hidden">0</span>
                </button>
                <button class="ni-tab" data-tab="audio">
                    Bioacoustics
                    <span id="audioTabBadge" class="ni-tab-counter hidden">0</span>
                </button>
                <button class="ni-tab" data-tab="literature">
                    Literature
                    <span id="litTabBadge" class="ni-tab-counter hidden">0</span>
                </button>
            </div>

            <!-- Tab Content Panel -->
            <div id="tabContent" class="ni-tab-content" role="tabpanel"></div>

        </div>
    </section>

    <!-- Lightbox Modal for Photo Gallery -->
    <div id="lightboxModal" class="ni-lightbox hidden">
        <div class="ni-lightbox-overlay" id="lightboxOverlay"></div>
        <div class="ni-lightbox-body">
            <button id="lightboxCloseBtn" class="ni-lightbox-close">✕</button>
            <img id="lightboxImg" class="ni-lightbox-img" src="" alt="Enlarged photo">
            <p id="lightboxCaption" class="ni-lightbox-caption"></p>
        </div>
    </div>

    <script>
        // Dr. Nexus Page Context Provider for Intelligence
        window.nexusContext = function() {
            const sci = document.getElementById('speciesSci')?.innerText?.trim() || '';
            const com = document.getElementById('speciesCommon')?.innerText?.trim() || '';
            const rank = document.getElementById('rankBadge')?.innerText?.trim() || 'SPECIES';
            const isResults = !document.getElementById('resultsSection')?.classList.contains('hidden');
            const landingInput = document.getElementById('searchInput')?.value.trim() || '';
            const activeTab = document.querySelector('.ni-tab.active')?.dataset.tab || 'overview';

            const activeName = isResults && sci && sci !== '—' ? `${com} (${sci})` : landingInput;

            return {
                tool: "Bio-Nexus Intelligence",
                icon: "🧠",
                accent: "#D97757",
                active: Boolean(activeName),
                summary: activeName ? `${activeName} · ${rank} · Tab: ${activeTab}` : "Awaiting search in Intelligence Engine",
                quickPrompts: [
                    "What are the key evolutionary milestones of this taxonomic lineage?",
                    "Synthesize the current open-access literature and clinical research",
                    "Explain what the acoustic recordings reveal about vocal communication"
                ],
                data: {
                    subject: activeName || null,
                    rank: isResults ? rank : null,
                    activeDashboardTab: activeTab
                }
            };
        };
    </script>
    <script src="../js/nexus-widget.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
